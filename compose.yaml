name: lighthouse-hub
x-runtime: &runtime
  image: lighthouse-hub:0.1.0
  build: .
  restart: unless-stopped
  init: true
  user: "10001:10001"
  env_file:
    - ./.env
  environment:
    HUB_ROOT: /opt/lighthouse-hub
    HUB_CONFIG: /opt/lighthouse-hub/config/hub.toml
    DRY_RUN: "true"
  volumes:
    - ./data:/opt/lighthouse-hub/data
    - ./media:/opt/lighthouse-hub/media
    - ./logs:/opt/lighthouse-hub/logs
    - ./backups:/opt/lighthouse-hub/backups
    - ./config:/opt/lighthouse-hub/config:ro
  read_only: true
  tmpfs:
    - /tmp:size=192m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 160
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *runtime
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 256m
    cpus: 0.5
    command: ["python","-m","services.hub.cli","api"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    <<: *runtime
    mem_limit: 192m
    cpus: 0.25
    command: ["python","-m","services.hub.cli","scheduler"]
  tweet-worker:
    <<: *runtime
    hostname: lighthouse-tweet-worker
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/lighthouse-hub/config/browser-seccomp.json
    mem_limit: 1400m
    shm_size: 256m
    cpus: 1.5
    command: ["python","-m","services.hub.cli","worker","--queue","tweet"]
  video-worker:
    <<: *runtime
    volumes:
      - ./data:/opt/lighthouse-hub/data
      - ./media:/opt/lighthouse-hub/media
      - ./logs:/opt/lighthouse-hub/logs
      - ./backups:/opt/lighthouse-hub/backups
      - ./config:/opt/lighthouse-hub/config:ro
      - ./data/browser-profiles/youtube:/opt/lighthouse-hub/data/browser-profiles/youtube:ro
    mem_limit: 1400m
    cpus: 1.5
    command: ["python","-m","services.hub.cli","worker","--queue","video"]
  system-worker:
    <<: *runtime
    mem_limit: 192m
    cpus: 0.25
    command: ["python","-m","services.hub.cli","worker","--queue","system"]

  replay-acquisition-worker:
    <<: *runtime
    profiles: [youtube-acquisition]
    # Override only this service when deploying an immutable, qualified image.
    image: ${LIGHTHOUSE_ACQUISITION_IMAGE:-lighthouse-hub:0.1.0}
    env_file: []
    environment:
      HUB_ROOT: /opt/lighthouse-hub
      HUB_CONFIG: /opt/lighthouse-hub/config/hub.toml
      DRY_RUN: "true"
      YOUTUBE_API_KEY_FILE: /run/secrets/youtube-api-key
    volumes:
      - ./data:/opt/lighthouse-hub/data
      - ./media:/opt/lighthouse-hub/media
      - ./logs:/opt/lighthouse-hub/logs
      - ./backups:/opt/lighthouse-hub/backups
      - ./config:/opt/lighthouse-hub/config:ro
      - ./data/browser-profiles/youtube:/opt/lighthouse-hub/data/browser-profiles/youtube:ro
    secrets:
      - source: youtube_api_key
        target: youtube-api-key
    mem_limit: 1400m
    cpus: 1.5
    stop_grace_period: 30s
    command: ["python","-m","services.hub.replay_multipart_worker_runtime_v4","--acquisition-only"]
    healthcheck:
      test: ["CMD","python","-m","services.hub.acquisition_health"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3

  replay-publication-worker:
    <<: *runtime
    profiles: [replay-publication]
    image: ${LIGHTHOUSE_PUBLICATION_IMAGE:-lighthouse-hub:0.1.0}
    # Explicit sending entry: requires the existing policy and launch evidence.
    # This profile is off by default and has no YouTube/API credential mount.
    env_file: []
    environment:
      HUB_ROOT: /opt/lighthouse-hub
      HUB_CONFIG: /opt/lighthouse-hub/config/video-runtime-v5.toml
      HOME: /tmp/lighthouse-browser
      DRY_RUN: "false"
    volumes:
      - ./data:/opt/lighthouse-hub/data
      - ./media:/opt/lighthouse-hub/media
      - ./logs:/opt/lighthouse-hub/logs
      - ./backups:/opt/lighthouse-hub/backups
      - ./config:/opt/lighthouse-hub/config:ro
      - ./data/browser-profiles/youtube:/opt/lighthouse-hub/data/browser-profiles/youtube:ro
      - type: bind
        source: /etc/lighthouse-hub/replay-parts-workflow-launch-v5.json
        target: /etc/lighthouse-hub/replay-parts-workflow-launch-v5.json
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/lighthouse-hub/config/browser-seccomp.json
    mem_limit: 1400m
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    stop_grace_period: 30s
    command: ["python","-m","services.hub.replay_parts_worker_runtime_v5","--publication-only"]
    healthcheck:
      test: ["CMD","python","-m","services.hub.publication_health"]
      start_period: 120s
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  youtube_api_key:
    file: ${YOUTUBE_API_KEY_SECRET_FILE:-./secrets/youtube-api-key}
