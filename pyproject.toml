[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-automation-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "apscheduler>=3.11,<4", "psutil>=6,<8", "mcp>=1.20,<2", "cryptography>=44,<48", "yt-dlp==2026.10.26", "yt-dlp-ejs==0.8.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2,<3"]

[project.scripts]
lighthouse = "services.hub.cli:main"

[tool.setuptools.packages.find]
include = ["services*", "adapters*", "scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 40
